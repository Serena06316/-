<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="本地题库管理与刷题工具：数据保存在浏览器 IndexedDB，支持 GitHub Pages 静态部署。" />
  <title>本地题库 · 刷题</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f6bed' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 19.5A2.5 2.5 0 0 1 6.5 17H20'/%3E%3Cpath d='M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z'/%3E%3C/svg%3E" />
  <script>
    /* 主题初始化（尽量提前，避免闪烁） */
    (function () {
      try {
        var t = localStorage.getItem('tiku-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) { /* 忽略 */ }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <a class="brand" href="#/" aria-label="返回首页">
      <span class="brand-icon" id="brand-icon"></span>
      <span class="brand-name">本地题库</span>
    </a>
    <nav class="top-nav" id="top-nav" aria-label="全局导航"></nav>
  </header>

  <main id="view" class="container"></main>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>

  <noscript>
    <div style="padding:40px;text-align:center;font-size:16px;">本应用需要启用 JavaScript 才能运行。</div>
  </noscript>

  <script src="js/ui.js"></script>
  <script src="js/db.js"></script>
  <script src="js/parse.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/public.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/views-core.js"></script>
  <script src="js/views-lib.js"></script>
  <script src="js/views-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
